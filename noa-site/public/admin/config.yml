backend:
  name: git-gateway
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

# 下書き運用しないなら true（無効でもOK）
publish_mode: simple

collections:
  - name: "updates"
    label: "UPDATES"
    format: "json"
    extension: "json"
    file: "public/content/updates.json"
    editor:
      preview: false
    fields:
      - label: "Items"
        name: "items"
        widget: "list"
        summary: "{{fields.date}} | {{fields.category}} | {{fields.title}}"
        fields:
          - { label: "slug", name: "slug", widget: "hidden", required: false, default: "" }
          - { label: "公開", name: "published", widget: "boolean", default: true }
          - { label: "日付（YYYY.MM.DD）", name: "date", widget: "string" }
          - { label: "カテゴリ", name: "category", widget: "string", default: "NEWS" }
          - { label: "タイトル", name: "title", widget: "string" }
          - { label: "本文（Markdown可）", name: "body", widget: "markdown", required: false }
          - { label: "リンク（任意）", name: "url", widget: "string", required: false }
          - { label: "画像（任意）", name: "image", widget: "image", required: false }