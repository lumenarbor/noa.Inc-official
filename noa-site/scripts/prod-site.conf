# =============================================================
# 本番サイトの同一性定義（single source of truth）
#
# ここに置く値はいずれも Netlify の公開識別子であり、秘密情報ではない。
# secret（トークン / webhook URL）は絶対にこのファイルへ書かないこと。
# 本番サイトを作り直した場合は、このファイル1つを更新すれば
# 全 guard / verify スクリプトへ伝播する。
#
# PROD_SITE_ID は .netlify/state.json（gitignore 済み・端末ローカル）が
# 別サイトを指してしまう事故を検知するための照合用。
# =============================================================

PROD_CUSTOM_DOMAIN="noa-place.co.jp"
PROD_SITE_ID="a6abd6bd-544a-4704-809a-e7356f03534d"
PROD_URL="https://noa-place.co.jp"

# 本番に必ず配備されていなければならない Netlify Functions
# （欠けると問い合わせの Slack 通知 / Notion 登録が無検知で停止する）
REQUIRED_FUNCTIONS="slack notion-intake"

# Netlify Forms の Outgoing Webhook が実際に叩く公開パス。
# /.netlify/functions/* を直接叩かせない（未配備時に 200 + index.html を返し、
# Webhook 側が成功と誤認するため）。/hooks/* からの rewrite なら未配備は 404。
WEBHOOK_PATHS="/hooks/slack /hooks/notion-intake"

# alias が解決されるべき内部エンドポイント（内部健全性の確認用）
INTERNAL_FUNCTION_PATHS="/.netlify/functions/slack /.netlify/functions/notion-intake"
